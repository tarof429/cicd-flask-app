services:
  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped
    volumes:
      - ./prometheus/:/etc/prometheus
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:13.2
    restart: unless-stopped
    ports:
      - "4444:3000"
    volumes:
      - "grafana:/var/lib/grafana"
volumes:
  grafana:
  promdata:
