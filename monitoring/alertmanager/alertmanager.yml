global:
  resolve_timeout: 5m
  smtp_require_tls: false

route:
  receiver: 'email-receiver'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

inhibit_rules:
    # If a critical alert and a warning alert have the same alertname and instance, 
    # suppress the warning notification.
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance']

receivers:
  - name: 'email-receiver'
    email_configs:
    - to: 'admin@example.com'
      from: 'alertmanager@example.com'
      smarthost: 'mailpit:1025'
      send_resolved: true
