global:
  scrape_interval: 15s
  evaluation_interval: 10s
alerting:
  alertmanagers:
    - static_configs:
      - targets: ['alertmanager:9093']
rule_files:
  - 'alert.rules.yml'
scrape_configs:
  - job_name: servers
    static_configs:
      - targets: ['192.168.1.226:9100', '192.168.1.30:9100']
  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets: ['192.168.1.226:3030', '192.168.1.30:3030']
  - job_name: registry
    scrape_interval: 10s
    static_configs:
      - targets: ['192.168.1.226:3001']