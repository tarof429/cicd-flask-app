- name: Generate token
  community.general.jenkins_credential:
    name: "test-token"
    jenkins_user: "{{ my_jenkins_user }}"
    jenkins_password: "{{ my_jenkins_password }}"
    type: "token"
    url: "{{ jenkins_url }}"
  register: token_result

- name: cicd-server-key
  community.general.jenkins_credential:
    id: "cicd-server-key"
    type: "ssh_key"
    jenkins_user: "{{ my_jenkins_user }}"
    token: "{{ token_result.token }}"
    description: "SSH key credential"
    username: "admin"
    private_key_path: /tmp/cicd-server-key
    url: "{{ jenkins_url }}"
    force: true
  delegate_to: localhost
