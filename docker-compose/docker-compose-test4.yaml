services:
  app:
    image: ${PRIVATE_REGISTRY_SERVER}:${PRIVATE_REGISTRY_PORT}/${PRIVATE_REPOSITORY}:${IMAGE_TAG}
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=True
      - RUNTIME_MODE=${RUNTIME_MODE:-dev}
      - DATABASE_URI=postgresql://admin:secret@db:5432/db
      - RABBITMQ_USER=user
      - RABBITMQ_PASS=password
      - RABBITMQ_VHOST=rabbitmq
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
    volumes:
      - "test-reports:/app/reports"
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 30s
      retries: 6
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_DEFAULT_VHOST=rabbitmq
    ports:
      - 15672:15672
  db:
    image: postgres:14.24-alpine3.23
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: db
    ports:
      - 5432:5432
    volumes:
      - data:/var/lib/postgresql/data
volumes:
  data:
  test-reports:
    name: "test-reports"