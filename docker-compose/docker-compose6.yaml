services:
  app:
    image: tarof429/events-app:${IMAGE_TAG}
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=False
      - RUNTIME_MODE=${RUNTIME_MODE:-dev}
      - DATABASE_URI=postgresql://admin:secret@db:5432/db
      - RABBITMQ_USER=user
      - RABBITMQ_PASS=password
      - PREFERENCES_CONFIG=/prefs/preferences.yaml
    ports:
      - 5000:5000
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      eventconsumer:
        condition: service_started
    volumes:
      - "prefs:/prefs"
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 30s
      retries: 6
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_DEFAULT_VHOST=rabbitmq
    ports:
      - 15672:15672
  eventconsumer:
    image: tarof429/event-consumer:${IMAGE_TAG}
    environment:
      - AMPQ_USER=user
      - AMPQ_PASSWORD=password
      - AMPQ_HOST=rabbitmq
      - AMPQ_PORT=5672
      - AMPQ_VHOST=rabbitmq
      - PREFERENCES_CONFIG=/prefs/preferences.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
        restart: true
    volumes:
      - "prefs:/prefs"
  db:
    image: postgres:14.24-alpine3.24
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: db
    volumes:
      - "data:/var/lib/postgresql/data"
volumes:
  data:
  prefs: