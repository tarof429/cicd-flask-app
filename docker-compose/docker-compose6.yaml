services:
  app:
    image: tarof429/events-app:${IMAGE_TAG}
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=False
      - RUNTIME_MODE=${RUNTIME_MODE:-dev}
      - DATABASE_URI=postgresql://admin:secret@db:5432/db
      - RABBITMQ_USER=rabbit
      - RABBITMQ_PASS=secret
      - PREFERENCES_CONFIG=/prefs/preferences.yaml
    ports:
      - 5000:5000
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      mailpit:
        condition: service_healthy
      eventconsumer:
        condition: service_started
    volumes:
      - "prefs:/prefs"
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s # check every 30 seconds
      timeout: 10s # Fail if the check takes longer than 10 seconds
      retries: 5 # Mark unhealthy after 3 consecutive failures
      start_period: 5s # grace period for startup
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=secret
      - RABBITMQ_DEFAULT_VHOST=rabbitmq
    ports:
      - 15672:15672
  eventconsumer:
    image: tarof429/event-consumer:${IMAGE_TAG}
    environment:
      - AMPQ_USER=rabbit
      - AMPQ_PASSWORD=secret
      - AMPQ_HOST=rabbitmq
      - AMPQ_PORT=5672
      - AMPQ_VHOST=rabbitmq
      - PREFERENCES_CONFIG=/prefs/preferences.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
        restart: true
    volumes:
      - "prefs:/prefs"
  db:
    image: postgres:14.24-alpine3.24
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: db
    volumes:
      - "data:/var/lib/postgresql/data"
  mailpit:
    image: axllent/mailpit
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --server-response http://localhost:8025/readyz 2>&1  | grep \"HTTP/\" | grep OK 2>& 1 > /dev/null"]
      interval: 5s # check every 30 seconds
      timeout: 10s # Fail if the check takes longer than 10 seconds
      retries: 5 # Mark unhealthy after 3 consecutive failures
      start_period: 5s # grace period for startup
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
volumes:
  data:
  prefs: