services:
  jenkins:
    image:  myjenkins:a92b7
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    restart: on-failure
  ssh-agent:
    image: jenkins/ssh-agent
    restart: on-failure
volumes:
  jenkins_home: