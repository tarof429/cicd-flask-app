services:
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s # check every 30 seconds
      timeout: 10s # Fail if the check takes longer than 10 seconds
      retries: 5 # Mark unhealthy after 3 consecutive failures
      start_period: 5s # grace period for startup
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_DEFAULT_VHOST=rabbitmq
    ports:
      - 15672:15672
  mailpit:
    image: axllent/mailpit
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --server-response http://localhost:8025/readyz 2>&1  | grep \"HTTP/\" | grep OK 2>& 1 > /dev/null"]
      interval: 5s # check every 30 seconds
      timeout: 10s # Fail if the check takes longer than 10 seconds
      retries: 5 # Mark unhealthy after 3 consecutive failures
      start_period: 5s # grace period for startup
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
  eventconsumer:
    image: event-consumer:latest
    environment:
      - AMPQ_USER=user
      - AMPQ_PASSWORD=password
      - AMPQ_HOST=rabbitmq
      - AMPQ_PORT=5672
      - AMPQ_VHOST=rabbitmq
      - PREFERENCES_CONFIG=/app/preferences.yaml
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
  eventproducer:
    image: event-producer:latest
    environment:
      - AMPQ_USER=user
      - AMPQ_PASSWORD=password
      - AMPQ_HOST=rabbitmq
      - AMPQ_PORT=5672
      - AMPQ_VHOST=rabbitmq
    depends_on:
      eventconsumer:
        condition: service_started
